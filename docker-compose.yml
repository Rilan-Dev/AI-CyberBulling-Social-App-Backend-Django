version: '3'

services:
  myapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_api
    ports:
      - "4001:8000"
    networks:
      - bridge
    hostname: api.home.local
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=UTC
      - DJANGO_SETTINGS_MODULE=project.settings
    working_dir: /app

networks:
  bridge:
    driver: bridge