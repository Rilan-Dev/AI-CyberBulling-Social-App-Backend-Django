version: '3'

services:
  myapi:
    build:
      context: /home/Rilan/backend
      dockerfile: Dockerfile
    container_name: backend_api
    ports:
      - "4001:8000"
    networks:
      - bridge
    hostname: api.home.local
    volumes:
      - /home/Rilan/backend:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=UTC
      - DJANGO_SETTINGS_MODULE=project.settings
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000

networks:
  bridge:
    driver: bridge